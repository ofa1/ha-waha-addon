name: "WAHA WhatsApp API"
version: "0.2.3"
slug: "waha_whatsapp_api"
description: "Self-hosted WAHA WhatsApp HTTP API for HAOS; useful for dedicated WhatsApp Channel posting automation."
url: "https://github.com/ofa1/ha-waha-addon"
arch:
  - aarch64
startup: services
init: false
stage: experimental
panel_icon: mdi:whatsapp
panel_title: WAHA
# Browser access is routed through Home Assistant ingress. The internal Nginx
# proxy listens on the default ingress port 8099 and forwards/rewrites
# requests to WAHA on 3000.
#
# `panel_admin` is not set: it already defaults to true, and it governs sidebar
# visibility rather than access to the ingress URL. See SECURITY.md.
#
# The Supervisor watchdog is driven by the Dockerfile's HEALTHCHECK; the
# `watchdog:` key here is obsolete.
ingress: true
ingress_entry: "/"
ingress_stream: true
ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Optional direct WAHA Dashboard/API host port fallback. Leave disabled when using Home Assistant ingress."
options:
  # Leave blank to auto-generate on first start and persist under /data/.secrets.env.
  # Set explicitly only if you want to rotate or manage credentials yourself.
  api_key: ""
  dashboard_enabled: true
  dashboard_username: "admin"
  # Leave blank to auto-generate on first start and persist under /data/.secrets.env.
  dashboard_password: ""
  # Off by default: WAHA generates a Swagger password and prints it to the
  # add-on log when none is supplied. Nothing here needs Swagger, so the
  # safest setting is to not run it at all.
  swagger_enabled: false
  default_engine: "GOWS"
  local_store_base_dir: "/data/.sessions"
  log_level: "info"
  timezone: "America/Toronto"
schema:
  api_key: "str"
  dashboard_enabled: "bool"
  dashboard_username: "str"
  dashboard_password: "password"
  swagger_enabled: "bool"
  default_engine: "list(GOWS|NOWEB|WEBJS)"
  local_store_base_dir: "str"
  log_level: "list(error|warn|info|debug|trace)"
  timezone: "str"
